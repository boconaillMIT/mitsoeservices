[build]
  publish = "public"

[[redirects]]
  from = "/donation-requests"
  to = "/.netlify/functions/donation-requests"
  status = 200
  force = true

[[redirects]]
  from = "/donation-requests/:action"
  to = "/.netlify/functions/donation-requests?action=:action"
  status = 200
  force = true

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["jose", "@netlify/blobs"]
  included_files = ["src/account-inventory-query.sql", "src/login.html", "src/dashboard.html", "src/admin.html", "src/report.html", "src/published-report.html"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'"

# Claude connector (remote MCP, read-only)
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

